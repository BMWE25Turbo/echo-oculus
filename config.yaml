echo_oculus:
  gps_device: OwnTracks
  alert_radius_miles: 2.5
  cop_cooldown_minutes: 30
  voice_alerts: true
  map_overlay_format: geojson

  feeds:
    waze: true
    twitter: true
    reddit: true
    scanner: optional

  # --- Logging: rotation + archive + retention (ACTIVE) ---
  logger:
    format: verbose                 # minimal | verbose | json
    root_dir: /var/log/echo-oculus  # live logs go here
    archive_dir: /var/log/echo-oculus/archive   # rotated logs moved here
    file: echo-oculus.log           # current log filename in root_dir
    rotate_when: midnight           # time-based rotation (midnight)
    rotate_backup_count: 14         # keep 14 daily logs in root_dir
    compress_archives: true         # gzip the rotated files in archive_dir
    log_retention_days: 180         # hard delete anything older than this in archive_dir
    console: true                   # also log to stdout (useful during dev)

  reliability:
    watchdog_enabled: true
    auto_reconnect: true
    service_warning_protocol: true
    sd_trim_strategy: oldest_first
    min_years_preserve: 3

  hardware:
    voltage_min_v: 4.8
    amperage_min_a: 4.5
    monitor_power: true

  # Placeholders for later phases (leave off for now)
  ml:
    enabled: false
    backend: rule_based
    stats_widget: false

  dashboard:
    enabled: false
    theme: dark
    widgets: []

  wot_res:
    enabled: false
    eval_rules: default
    hazard_tracking: false

  backup:
    enabled: false
    backup_path: /mnt/external_drive

  about:
    summary: >
      Echo Oculus cross-references public safety data with your GPS location
      to notify you of nearby police activity and encourage safer driving.
      This system does not interfere with law enforcement.

